<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Sandeep Meche — AI/ML Engineer and Frontend Developer</title>
  <desc id="d">Animated developer profile card with orbiting planets</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0706"/>
      <stop offset="0.55" stop-color="#140a07"/>
      <stop offset="1" stop-color="#2a130a"/>
    </linearGradient>

    <radialGradient id="glow" cx="950" cy="215" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a3d" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#b0431a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
      <animate attributeName="r" values="300;350;300" dur="6s" repeatCount="indefinite"/>
    </radialGradient>

    <radialGradient id="core" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#3a1b10"/>
      <stop offset="1" stop-color="#150a06"/>
    </radialGradient>

    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0">
      <stop offset="0" stop-color="#fff4ec"/>
      <stop offset="0.38" stop-color="#fff4ec"/>
      <stop offset="0.5" stop-color="#ffa561"/>
      <stop offset="0.62" stop-color="#fff4ec"/>
      <stop offset="1" stop-color="#fff4ec"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-420 0" to="760 0" dur="5s" begin="2.2s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="role" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#ffc08a"/>
    </linearGradient>

    <linearGradient id="runner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a3d" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffc08a"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ff9a5c" stroke-opacity="0.07" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="12s" repeatCount="indefinite"/>
    </pattern>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <clipPath id="card"><rect x="8" y="8" width="1184" height="424" rx="28"/></clipPath>
    <clipPath id="roleWipe">
      <rect x="60" y="205" width="0" height="48">
        <animate attributeName="width" from="0" to="620" dur="1.4s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Card base -->
  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#grid)"/>
    <rect width="1200" height="440" fill="url(#glow)"/>

    <!-- floating embers -->
    <g fill="#ffb27a">
      <circle cx="700" cy="400" r="1.6" opacity="0"><animate attributeName="cy" values="420;40" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="420" r="1.2" opacity="0"><animate attributeName="cy" values="430;60" dur="12s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="12s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="410" r="1.8" opacity="0"><animate attributeName="cy" values="430;50" dur="10s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="1130" cy="420" r="1.3" opacity="0"><animate attributeName="cy" values="430;80" dur="11s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="11s" begin="4s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="410" r="1.4" opacity="0"><animate attributeName="cy" values="430;70" dur="13s" begin="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="13s" begin="6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- ORBIT SYSTEM -->
    <g>
      <!-- slow rotating dashed ring -->
      <g>
        <circle cx="950" cy="215" r="150" fill="none" stroke="#ff9a5c" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 8"/>
        <animateTransform attributeName="transform" type="rotate" from="0 950 215" to="360 950 215" dur="60s" repeatCount="indefinite"/>
      </g>

      <!-- orbit 1 -->
      <g transform="rotate(-28 950 215)">
        <ellipse cx="950" cy="215" rx="200" ry="70" fill="none" stroke="#ff7a3d" stroke-opacity="0.35"/>
        <circle r="7" fill="#ff7a3d">
          <animateMotion dur="14s" repeatCount="indefinite" path="M1150,215 a200,70 0 1,1 -400,0 a200,70 0 1,1 400,0 Z"/>
        </circle>
        <circle r="14" fill="#ff7a3d" opacity="0.35" filter="url(#soft)">
          <animateMotion dur="14s" repeatCount="indefinite" path="M1150,215 a200,70 0 1,1 -400,0 a200,70 0 1,1 400,0 Z"/>
        </circle>
      </g>

      <!-- orbit 2 -->
      <g transform="rotate(32 950 215)">
        <ellipse cx="950" cy="215" rx="185" ry="58" fill="none" stroke="#ffb27a" stroke-opacity="0.28"/>
        <circle r="5" fill="#5ee0c1">
          <animateMotion dur="9s" repeatCount="indefinite" path="M1135,215 a185,58 0 1,0 -370,0 a185,58 0 1,0 370,0 Z"/>
        </circle>
        <circle r="11" fill="#5ee0c1" opacity="0.3" filter="url(#soft)">
          <animateMotion dur="9s" repeatCount="indefinite" path="M1135,215 a185,58 0 1,0 -370,0 a185,58 0 1,0 370,0 Z"/>
        </circle>
      </g>

      <!-- orbit 3 -->
      <g transform="rotate(88 950 215)">
        <ellipse cx="950" cy="215" rx="160" ry="48" fill="none" stroke="#fff4ec" stroke-opacity="0.18"/>
        <circle r="4" fill="#fff4ec">
          <animateMotion dur="19s" repeatCount="indefinite" path="M1110,215 a160,48 0 1,1 -320,0 a160,48 0 1,1 320,0 Z"/>
        </circle>
      </g>

      <!-- core -->
      <circle cx="950" cy="215" r="82" fill="#ff7a3d" opacity="0.18" filter="url(#soft)">
        <animate attributeName="opacity" values="0.12;0.3;0.12" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="950" cy="215" r="82" fill="url(#core)" stroke="#ff9a5c" stroke-opacity="0.7" stroke-width="1.5"/>
      <circle cx="950" cy="215" r="70" fill="none" stroke="#ff9a5c" stroke-opacity="0.35" stroke-dasharray="3 5">
        <animateTransform attributeName="transform" type="rotate" from="360 950 215" to="0 950 215" dur="24s" repeatCount="indefinite"/>
      </circle>
      <text x="950" y="226" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="900" fill="#fff4ec" letter-spacing="-2">SM</text>
      <text x="950" y="252" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="800" fill="#ff9a5c" letter-spacing="3">BUILD / LEARN</text>
    </g>

    <!-- TEXT BLOCK -->
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
      <!-- badge -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.2s" fill="freeze"/>
        <rect x="60" y="46" width="52" height="52" rx="14" fill="#2a130a" stroke="#ff7a3d" stroke-opacity="0.7"/>
        <text x="86" y="80" text-anchor="middle" font-size="22" font-weight="900" fill="#ffa561" letter-spacing="-1">SM</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.35s" fill="freeze"/>
        <text x="128" y="64" font-size="12" font-weight="800" fill="#ff9a5c" letter-spacing="4">DEVELOPER PROFILE / 2026</text>
        <text x="128" y="88" font-size="16" font-weight="700" fill="#fff4ec">Computing · AI · Interfaces</text>
      </g>

      <!-- name -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.5s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="-24 0" to="0 0" dur="0.8s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
        <text x="58" y="190" font-size="84" font-weight="900" letter-spacing="-3" fill="url(#name)">Sandeep Meche</text>
      </g>

      <!-- role (wipe-in) -->
      <g clip-path="url(#roleWipe)">
        <text x="60" y="238" font-size="30" font-weight="800" letter-spacing="-0.5" fill="url(#role)">AI/ML Engineer <tspan fill="#8a3a1c">/</tspan> Frontend Developer</text>
      </g>

      <!-- tagline -->
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.9s" fill="freeze"/>
        <text x="60" y="278" font-size="17" font-weight="600" fill="#d9bba9">Building expressive interfaces and practical AI-powered products.</text>
      </g>

      <!-- chips -->
      <g>
        <g opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.2s" fill="freeze"/>
          <rect x="60" y="304" width="150" height="42" rx="21" fill="#2a130a" stroke="#ff7a3d" stroke-opacity="0.65"/>
          <circle cx="86" cy="325" r="4" fill="#ff7a3d"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
          <text x="100" y="330" font-size="13" font-weight="800" fill="#ffc08a" letter-spacing="1.5">FRONTEND</text>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.4s" fill="freeze"/>
          <rect x="222" y="304" width="130" height="42" rx="21" fill="#2a130a" stroke="#5ee0c1" stroke-opacity="0.55"/>
          <circle cx="248" cy="325" r="4" fill="#5ee0c1"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
          <text x="262" y="330" font-size="13" font-weight="800" fill="#ffc08a" letter-spacing="1.5">AI / ML</text>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.6s" fill="freeze"/>
          <rect x="364" y="304" width="160" height="42" rx="21" fill="#2a130a" stroke="#ffb27a" stroke-opacity="0.55"/>
          <circle cx="390" cy="325" r="4" fill="#ffb27a"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
          <text x="404" y="330" font-size="13" font-weight="800" fill="#ffc08a" letter-spacing="1.5">AUTOMATION</text>
        </g>
      </g>

      <!-- rule + footer -->
      <rect x="60" y="374" width="0" height="3" rx="1.5" fill="url(#rule)">
        <animate attributeName="width" from="0" to="560" dur="1.2s" begin="2.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
      </rect>
      <text x="60" y="404" font-size="11" font-weight="800" fill="#b8734f" letter-spacing="2.6" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="3.2s" fill="freeze"/>
        ISLINGTON COLLEGE · COMPUTING WITH ARTIFICIAL INTELLIGENCE
      </text>
    </g>
  </g>

  <!-- card border + travelling light -->
  <rect x="8" y="8" width="1184" height="424" rx="28" fill="none" stroke="#ff7a3d" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="8" y="8" width="1184" height="424" rx="28" fill="none" stroke="url(#runner)" stroke-width="2.5" stroke-linecap="round" pathLength="100" stroke-dasharray="14 86">
    <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
