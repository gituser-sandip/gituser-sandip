<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-labelledby="t">
<title id="t">Technical arsenal: AI, frontend, backend and tools</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0609"/><stop offset="0.55" stop-color="#150a12"/><stop offset="1" stop-color="#3a1424"/></linearGradient>
<radialGradient id="glow" cx="1080" cy="170" r="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e57fa8" stop-opacity="0.28"/><stop offset="1" stop-color="#e57fa8" stop-opacity="0"/><animate attributeName="r" values="340;420;340" dur="6s" repeatCount="indefinite"/></radialGradient>
<linearGradient id="ttl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="360" y2="0"><stop offset="0" stop-color="#fff4f8"/><stop offset="0.38" stop-color="#fff4f8"/><stop offset="0.5" stop-color="#f08db4"/><stop offset="0.62" stop-color="#fff4f8"/><stop offset="1" stop-color="#fff4f8"/><animateTransform attributeName="gradientTransform" type="translate" from="-360 0" to="700 0" dur="5.5s" begin="1.6s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e57fa8" stop-opacity="0"/><stop offset="0.3" stop-color="#e57fa8"/><stop offset="1" stop-color="#ffc2d8" stop-opacity="0.8"/></linearGradient>
<linearGradient id="runner" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e57fa8" stop-opacity="0"/><stop offset="1" stop-color="#ffc2d8"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e57fa8" stroke-opacity="0.07"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="14s" repeatCount="indefinite"/></pattern>
<filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
<clipPath id="card"><rect x="4" y="4" width="1192" height="192" rx="24"/></clipPath>
</defs>
<g clip-path="url(#card)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<rect width="1200" height="200" fill="url(#bg)"/><rect width="1200" height="200" fill="url(#grid)"/><rect width="1200" height="200" fill="url(#glow)"/>
<path d="M680 90 C 788 150, 864 120, 972 80 S 1101 30, 1220 120" fill="none" stroke="#e57fa8" stroke-opacity="0.22" stroke-width="1.3" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.6s" begin="0.6s" fill="freeze"/></path>
<path d="M680 120 C 766 170, 842 150, 950 100 S 1101 40, 1220 120" fill="none" stroke="url(#line)" stroke-width="2" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.2s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.3 0.7 0.2 1" keyTimes="0;1"/></path>
<path d="M680 120 C 766 170, 842 150, 950 100 S 1101 40, 1220 120" fill="none" stroke="#ffe3ee" stroke-width="2.6" stroke-linecap="round" pathLength="1000" stroke-dasharray="46 954" stroke-dashoffset="46" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.8s" fill="freeze"/><animate attributeName="stroke-dashoffset" from="46" to="-1000" dur="5s" begin="2.8s" repeatCount="indefinite"/></path>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.2s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-14 0" to="0 0" dur="0.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
<text x="48" y="52" font-size="13" font-weight="800" fill="#e57fa8" letter-spacing="9">SANDEEP / MECHE</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-22 0" to="0 0" dur="0.8s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
<text x="46" y="118" font-size="58" font-weight="900" letter-spacing="-1.5" fill="url(#ttl)">Technical arsenal</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.2s" fill="freeze"/>
<text x="50" y="160" font-size="15" font-weight="800" fill="#e8c3d3" letter-spacing="3.5">AI · FRONTEND · BACKEND · TOOLS</text></g>
<circle r="5" fill="#ffe3ee" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="3s" fill="freeze"/><animateMotion dur="7s" begin="3s" repeatCount="indefinite" path="M680 90 C 788 150, 864 120, 972 80 S 1101 30, 1220 120"/></circle>
<circle r="12" fill="#e57fa8" opacity="0" filter="url(#soft)"><animate attributeName="opacity" from="0" to="0.5" dur="0.2s" begin="3s" fill="freeze"/><animateMotion dur="7s" begin="3s" repeatCount="indefinite" path="M680 90 C 788 150, 864 120, 972 80 S 1101 30, 1220 120"/></circle>
</g>
<rect x="4" y="4" width="1192" height="192" rx="24" fill="none" stroke="#e57fa8" stroke-opacity="0.28" stroke-width="1.5"/>
<rect x="4" y="4" width="1192" height="192" rx="24" fill="none" stroke="url(#runner)" stroke-width="2.5" stroke-linecap="round" pathLength="100" stroke-dasharray="10 90"><animate attributeName="stroke-dashoffset" from="-17" to="-117" dur="10s" repeatCount="indefinite"/></rect>
</svg>