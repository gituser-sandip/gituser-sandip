<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="sm-title sm-desc">
  <title id="sm-title">Sandeep Meche — AI/ML Engineer and Frontend Developer</title>
  <desc id="sm-desc">Cinematic burgundy identity with technical grid, orbital geometry, animated path, and rose light.</desc>
  <defs>
    <linearGradient id="sm-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10070C"/><stop offset=".52" stop-color="#190B12"/><stop offset="1" stop-color="#451126"/></linearGradient>
    <linearGradient id="sm-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D" stop-opacity="0"/><stop offset=".5" stop-color="#C77B9B" stop-opacity=".7"/><stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/><animate attributeName="x1" values="-1;1;-1" dur="11s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="sm-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D"/><stop offset=".55" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B"/></linearGradient>
    <radialGradient id="sm-halo"><stop offset="0" stop-color="#701A3D" stop-opacity=".5"/><stop offset="1" stop-color="#10070C" stop-opacity="0"/></radialGradient>
    <pattern id="sm-grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#E5B5C7" stroke-opacity=".075" stroke-width=".7"/><circle cx="0" cy="0" r="1" fill="#C77B9B" fill-opacity=".22"/></pattern>
    <filter id="sm-glow" x="-40%" y="-400%" width="180%" height="900%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <mask id="sm-fade"><linearGradient id="sm-mask-gradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="white"/><stop offset=".85" stop-color="white" stop-opacity=".8"/><stop offset="1" stop-color="white" stop-opacity=".1"/></linearGradient><rect width="1200" height="430" fill="url(#sm-mask-gradient)"/></mask>
  </defs>
  <rect width="1200" height="430" rx="18" fill="url(#sm-bg)"/><rect width="1200" height="430" rx="18" fill="url(#sm-grid)"/><ellipse cx="950" cy="180" rx="360" ry="280" fill="url(#sm-halo)"/>
  <path d="M730 40C910 85 1000 15 1160 70S1070 240 1190 300" fill="none" stroke="#C77B9B" stroke-opacity=".18"/><path d="M790 30C970 105 1040 42 1180 110S1070 255 1200 320" fill="none" stroke="#E5B5C7" stroke-opacity=".12"/>
  <g transform="translate(970 188)" fill="none" stroke="#C77B9B" stroke-opacity=".34"><ellipse rx="148" ry="52" transform="rotate(-34)"/><ellipse rx="148" ry="52" transform="rotate(34)"/><circle r="88" stroke-dasharray="2 9"/><circle r="5" fill="#E5B5C7" stroke="none"/><circle cx="112" cy="-64" r="4" fill="#C77B9B" stroke="none"><animate attributeName="opacity" values=".35;1;.35" dur="3.5s" repeatCount="indefinite"/></circle><circle cx="-110" cy="66" r="3" fill="#E5B5C7" stroke="none"/></g>
  <g mask="url(#sm-fade)"><path d="M0 330C190 275 245 360 430 310S690 270 820 320S1050 365 1200 290" fill="none" stroke="url(#sm-line)" stroke-width="1.4" stroke-opacity=".72"/><path d="M0 330C190 275 245 360 430 310S690 270 820 320S1050 365 1200 290" fill="none" stroke="#E5B5C7" stroke-width="2.2" stroke-dasharray="44 900" filter="url(#sm-glow)"><animate attributeName="stroke-dashoffset" values="950;0" dur="8s" repeatCount="indefinite"/></path></g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="76" y="78" font-size="12" letter-spacing="4" fill="#C77B9B">ENGINEERING / INTELLIGENCE / INTERFACE</text><path d="M76 101H142" stroke="#C77B9B" stroke-width="2"/>
    <text x="70" y="184" font-size="68" font-weight="650" letter-spacing="-2.4" fill="#F8F0F3">Sandeep Meche</text>
    <text x="76" y="229" font-size="21" fill="#E5B5C7">AI/ML Engineer <tspan fill="#701A3D">/</tspan> Frontend Developer</text>
    <text x="77" y="273" font-size="13" letter-spacing="1.3" fill="#F8F0F3" fill-opacity=".72">COMPUTING WITH ARTIFICIAL INTELLIGENCE</text><text x="77" y="294" font-size="13" letter-spacing="1.3" fill="#F8F0F3" fill-opacity=".72">ISLINGTON COLLEGE</text>
    <path d="M76 330H495" stroke="#701A3D" stroke-width="2.5" stroke-linecap="round"/><path d="M76 330H495" stroke="#E5B5C7" stroke-width="2.5" stroke-linecap="round" filter="url(#sm-glow)" stroke-dasharray="190 230"><animate attributeName="stroke-dashoffset" values="420;0;420" dur="6s" repeatCount="indefinite"/></path>
    <text x="76" y="375" font-size="11" letter-spacing="3.2" fill="#C77B9B">DESIGNING SYSTEMS. BUILDING WHAT'S NEXT.</text>
  </g><rect x=".5" y=".5" width="1199" height="429" rx="18" fill="none" stroke="#C77B9B" stroke-opacity=".28"/>
</svg>