<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 240" width="590" height="240" role="img" aria-labelledby="t d">
<title id="t">MindWell</title><desc id="d">A digital wellbeing project. Visit the repository for its current implementation and technical details. Focus: Application development</desc>
<defs>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="0.7" stop-color="#120b14"/><stop offset="1" stop-color="#220f1d"/></linearGradient>
<linearGradient id="runner" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e57fa8" stop-opacity="0"/><stop offset="1" stop-color="#ffc2d8"/></linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e57fa8" stop-opacity="0"/><stop offset="0.5" stop-color="#e57fa8" stop-opacity="0.16"/><stop offset="1" stop-color="#e57fa8" stop-opacity="0"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc2d8"/><stop offset="1" stop-color="#e57fa8" stop-opacity="0.2"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e57fa8" stroke-opacity="0.06"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="14s" repeatCount="indefinite"/></pattern>
<clipPath id="card"><rect x="4" y="4" width="582" height="232" rx="20"/></clipPath>
</defs>
<g clip-path="url(#card)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<rect width="590" height="240" fill="url(#panel)"/><rect width="590" height="240" fill="url(#grid)"/>
<rect x="4" y="4" width="6" height="232" fill="url(#accent)"/>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.30000000000000004s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.6s" begin="0.30000000000000004s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/><text x="36" y="64" font-size="25" font-weight="800" letter-spacing="-0.5" fill="#f6eaf1">MindWell</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.6s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/><text x="36" y="104" font-size="16" fill="#c4abbc">A digital wellbeing project. Visit the repository for its</text><text x="36" y="129" font-size="16" fill="#c4abbc">current implementation and technical details.</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9s" fill="freeze"/><text x="36" y="205" font-size="13" font-weight="800" fill="#e57fa8" letter-spacing="2">FOCUS</text><text x="113" y="205" font-size="16" font-weight="600" fill="#f1e2ea">Application development</text></g>
<g><circle cx="540" cy="52" r="20" fill="none" stroke="#e57fa8" stroke-opacity="0.5"/><g stroke="#ffc2d8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M532 60 L548 44 M537 44 H548 V55"/><animateTransform attributeName="transform" type="translate" values="0 0;3 -3;0 0" dur="2.6s" begin="0.5s" repeatCount="indefinite"/></g></g>
<rect x="-200" y="0" width="180" height="240" fill="url(#sweep)"><animate attributeName="x" from="-200" to="610" dur="6s" begin="4.0s" repeatCount="indefinite"/></rect>
</g>
<rect x="4" y="4" width="582" height="232" rx="20" fill="none" stroke="#e57fa8" stroke-opacity="0.28" stroke-width="1.5"/>
<rect x="4" y="4" width="582" height="232" rx="20" fill="none" stroke="url(#runner)" stroke-width="2.5" stroke-linecap="round" pathLength="100" stroke-dasharray="12 88"><animate attributeName="stroke-dashoffset" from="-25" to="-125" dur="9s" repeatCount="indefinite"/></rect>
</svg>