<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">About Sandeep Meche and focus areas</title>
  <desc id="d">Sandeep Meche, AI/ML Engineer and Frontend Developer studying Computing with Artificial Intelligence at Islington College. Focus areas: frontend and UI engineering, AI integrations and experiments, API-driven applications, workflow automation.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.7" stop-color="#120b14"/>
      <stop offset="1" stop-color="#220f1d"/>
    </linearGradient>
    <linearGradient id="role" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f08db4"/>
      <stop offset="1" stop-color="#ffc2d8"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e57fa8" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#e57fa8"/>
      <stop offset="1" stop-color="#ffc2d8" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="runner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e57fa8" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffc2d8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e57fa8" stroke-opacity="0.06"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="14s" repeatCount="indefinite"/>
    </pattern>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="card"><rect x="8" y="8" width="1184" height="364" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect width="1200" height="380" fill="url(#panel)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>

    <!-- column divider -->
    <line x1="820" y1="40" x2="820" y2="340" stroke="#e57fa8" stroke-opacity="0.22"/>

    <!-- LEFT: about -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-20 0" to="0 0" dur="0.7s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
      <text x="48" y="96" font-size="42" font-weight="800" letter-spacing="-1" fill="#f6eaf1">Sandeep Meche</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.6s" fill="freeze"/>
      <text x="48" y="138" font-size="23" font-weight="700" fill="url(#role)">AI/ML Engineer <tspan fill="#8c4f6e">·</tspan> Frontend Developer</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1s" fill="freeze"/>
      <text x="48" y="190" font-size="18" fill="#e9d6e1">Computing with Artificial Intelligence at <tspan font-weight="800" fill="#ffffff">Islington College</tspan>.</text>
      <text x="48" y="236" font-size="17" fill="#bfa5b6">I enjoy creating polished digital experiences and exploring practical</text>
      <text x="48" y="264" font-size="17" fill="#bfa5b6">AI-powered products, web applications, API integrations, and</text>
      <text x="48" y="292" font-size="17" fill="#bfa5b6">automation workflows.</text>
    </g>

    <!-- signal wave -->
    <path id="sig" d="M48 336 C 150 308, 250 364, 370 336 S 590 308, 700 336 S 770 348 796 336" fill="none" stroke="url(#wave)" stroke-width="2" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.4s" begin="1.6s" fill="freeze" calcMode="spline" keySplines="0.3 0.7 0.2 1" keyTimes="0;1"/>
    </path>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4s" fill="freeze"/>
      <circle r="4" fill="#ffc2d8">
        <animateMotion dur="6s" begin="4s" repeatCount="indefinite" path="M48 336 C 150 308, 250 364, 370 336 S 590 308, 700 336 S 770 348 796 336"/>
      </circle>
      <circle r="10" fill="#e57fa8" opacity="0.4" filter="url(#soft)">
        <animateMotion dur="6s" begin="4s" repeatCount="indefinite" path="M48 336 C 150 308, 250 364, 370 336 S 590 308, 700 336 S 770 348 796 336"/>
      </circle>
    </g>

    <!-- RIGHT: focus areas -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.5s" fill="freeze"/>
      <text x="860" y="82" font-size="26" font-weight="800" fill="#f6eaf1">Focus areas</text>
    </g>

    <!-- row highlights (cycle through) -->
    <g fill="#e57fa8">
      <rect x="846" y="104" width="330" height="48" rx="10" opacity="0"><animate attributeName="opacity" values="0;0.13;0;0" keyTimes="0;0.125;0.25;1" dur="8s" begin="4s" repeatCount="indefinite"/></rect>
      <rect x="846" y="164" width="330" height="48" rx="10" opacity="0"><animate attributeName="opacity" values="0;0.13;0;0" keyTimes="0;0.125;0.25;1" dur="8s" begin="6s" repeatCount="indefinite"/></rect>
      <rect x="846" y="224" width="330" height="48" rx="10" opacity="0"><animate attributeName="opacity" values="0;0.13;0;0" keyTimes="0;0.125;0.25;1" dur="8s" begin="8s" repeatCount="indefinite"/></rect>
      <rect x="846" y="284" width="330" height="48" rx="10" opacity="0"><animate attributeName="opacity" values="0;0.13;0;0" keyTimes="0;0.125;0.25;1" dur="8s" begin="10s" repeatCount="indefinite"/></rect>
    </g>

    <!-- 1 Frontend -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="16 0" to="0 0" dur="0.5s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
      <rect x="861" y="119" width="22" height="18" rx="3" fill="none" stroke="#f08db4" stroke-width="1.8"/>
      <line x1="861" y1="125" x2="883" y2="125" stroke="#f08db4" stroke-width="1.8"/>
      <circle cx="865.5" cy="122" r="1" fill="#f08db4"/>
      <text x="902" y="134" font-size="16.5" fill="#f1e2ea">Frontend and UI engineering</text>
    </g>

    <!-- 2 AI -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.15s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="16 0" to="0 0" dur="0.5s" begin="1.15s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
      <path d="M862 195 L872 181 L882 195 Z" fill="none" stroke="#f08db4" stroke-opacity="0.6" stroke-width="1.4"/>
      <circle cx="862" cy="195" r="3" fill="#f08db4"/>
      <circle cx="872" cy="181" r="3" fill="#f08db4"><animate attributeName="r" values="3;4.6;3" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="882" cy="195" r="3" fill="#f08db4"/>
      <text x="902" y="194" font-size="16.5" fill="#f1e2ea">AI integrations and experiments</text>
    </g>

    <!-- 3 API -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="16 0" to="0 0" dur="0.5s" begin="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
      <text x="872" y="254" text-anchor="middle" font-size="22" font-weight="800" fill="#f08db4" font-family="Consolas,'Courier New',monospace">{ }</text>
      <text x="902" y="254" font-size="16.5" fill="#f1e2ea">API-driven applications</text>
    </g>

    <!-- 4 Workflow -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.65s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="16 0" to="0 0" dur="0.5s" begin="1.65s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
      <g>
        <path d="M872 300 A9 9 0 1 1 863 309" fill="none" stroke="#f08db4" stroke-width="2" stroke-linecap="round"/>
        <path d="M859 303 L863 309.5 L869 305" fill="none" stroke="#f08db4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <animateTransform attributeName="transform" type="rotate" from="0 872 309" to="360 872 309" dur="6s" repeatCount="indefinite"/>
      </g>
      <text x="902" y="314" font-size="16.5" fill="#f1e2ea">Workflow automation</text>
    </g>
  </g>

  <!-- border + travelling light -->
  <rect x="8" y="8" width="1184" height="364" rx="22" fill="none" stroke="#e57fa8" stroke-opacity="0.28" stroke-width="1.5"/>
  <rect x="8" y="8" width="1184" height="364" rx="22" fill="none" stroke="url(#runner)" stroke-width="2.5" stroke-linecap="round" pathLength="100" stroke-dasharray="12 88">
    <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="10s" repeatCount="indefinite"/>
  </rect>
</svg>
